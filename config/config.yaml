# Configuration for DNS Block List Checker.

# General settings.
run_once: false  # If true, the script will run once and then exit.
sleep_hours: 3   # Hours to sleep between checks if run_once is false.
keep_last_reports: 5 # Number of latest reports to keep, older ones will be deleted after notifications.

# File paths.
rbls_file: "/etc/dnsblchk/rbls.txt" # File containing the list of IP-based RBL zones.
dbls_file: "/etc/dnsblchk/dbls.txt" # File containing the list of domain-based DBL zones.
ips_file: "/etc/dnsblchk/ips.txt"   # File containing the list of IP addresses to check.
report_dir: "/var/log/dnsblchk/"    # Directory for storing report files.

# Optional labels for report grouping. Use documentation-reserved networks in the example config.
address_groups:
  example-primary:
    - "192.0.2.0/24"
  example-secondary:
    - "198.51.100.0/24"

# DNS nameservers for DNS block list queries.
nameservers:
  - "208.67.222.222"  # OpenDNS nameserver.
  - "208.67.220.220"  # OpenDNS nameserver (secondary).

# Confirmation nameservers (optional). When set, any positive listing seen via
# the primary nameservers above is re-queried through these resolvers, and
# only reported if they agree. Suppresses false positives from transient
# upstream DNS anomalies (a public resolver briefly returning a bogus DBL
# code, for example). Leave empty to disable.
nameservers_confirm: []
#  - "8.8.8.8"
#  - "8.8.4.4"

# DBL persistence gate: require a DBL sighting to appear in this many
# consecutive runs before it counts as an alertable listing. 1 = legacy
# single-run alerting. 2 = require a listing to persist across one run
# boundary (~sleep_hours). Applies to DBL (domain-based) checks only; RBL
# sightings always alert on first sighting.
require_consecutive_runs: 2

# Pool-flood warning threshold: when this many IPs of a single pool are
# newly listed on a single DBL server via the same registrable apex, log a
# WARNING flagging the pattern as a likely transient DNS anomaly. Alerts
# still fire; the warning is guidance for the operator. Set to 0 to disable.
pool_flood_threshold: 20

# Threading settings.
threading:
  enabled: true    # Enable multithreading for DNS block list checks (default: true).
  thread_count: 10 # Number of worker threads (default: 10, minimum: 1).

# Email alerting.
email:
  enabled: false # If true, an email report will be sent if there are listed IPs.
  recipients:
    - "tony@example.com"
  sender: "dnsblchk@example.com"
  smtp_host: "localhost"
  smtp_port: 25
  # Optional SMTP authentication.
  smtp_user: ""         # Username for SMTP AUTH (leave empty if not needed).
  smtp_password: ""     # Password for SMTP AUTH (leave empty if not needed).
  # Encryption settings (choose one).
  use_tls: false         # Use STARTTLS (typical port 587).
  use_ssl: false         # Use implicit SSL (typical port 465). If true, overrides use_tls.

# Webhook alerting.
webhooks:
  enabled: false # If true, webhook notifications will be sent if there are listed IPs.
  # List of webhook URLs to post notifications to (e.g., ["https://example.com/webhook"]).
  urls: []
  timeout: 10    # Timeout in seconds for webhook requests (default: 10).
  # Slack bot credentials — optional. When both are set, run reports are
  # uploaded as CSV files to Slack alongside the webhook summary message.
  # Requires a bot token with `files:write` and access to the channel.
  slack_bot_token: ""
  slack_channel_id: ""

# API-based IP update.
api_update:
  enabled: false # If true, IP addresses will be fetched from an API before each check run.
  url: ""        # API endpoint URL that returns text/plain with one IP per line.
  # Authentication settings.
  auth_type: "none"    # Authentication type: 'none', 'basic', or 'bearer' (default: 'none').
  username: ""         # Username for basic authentication (required if auth_type is 'basic').
  password: ""         # Password for basic authentication (required if auth_type is 'basic').
  bearer_token: ""     # Bearer token for bearer authentication (required if auth_type is 'bearer').
  timeout: 10          # Timeout in seconds for API requests (default: 10).

# Optional pool label file. If set, PoolResolver reads {cidr, label} entries
# from this JSON file to enrich Slack messages with per-IP pool labels.
# Redundant when address_groups above already covers your CIDRs — leave
# empty to disable.
pools_file: ""

# Alert suppressions — mute notifications for specific IPs until a date.
# IPs are still checked and logged, but excluded from webhook/email alerts.
suppressions: []
#  - ip: "192.0.2.10"
#    until: "2026-12-31"
#    reason: "known false positive, delisting requested"

# Logging settings.
logging:
  level: "INFO"                 # Logging level: DEBUG, INFO, WARN, ERROR (default: INFO).
  console_print: false          # Print logs to console in addition to file (default: true).
  log_dir: "/var/log/dnsblchk/" # Directory for log files.
  log_file: "dnsblchk.log"      # Log filename (will be combined with log_dir).
  clear_log_on_start: true      # If true, erase log file contents before starting to log.
  # Directory for per-run log files (used by Slack bot to capture specific runs)
  run_log_dir: "/var/log/dnsblchk/runs"
  # Number of run log files to keep (older files are automatically deleted)
  keep_last_runs: 10
