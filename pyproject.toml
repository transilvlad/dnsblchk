[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsblchk"
version = "2.0.0"
description = "A DNS Block List Checker service."
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "DNS Block List Checker", email = "transilvlad@gmail.com" } ]
requires-python = ">=3.10"
urls = { homepage = "https://github.com/example/dnsblchk" }
keywords = ["dns", "block list", "monitoring", "email", "rbl", "dbl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "pyyaml",
  "dnspython",
  "requests"
]

[project.scripts]
dnsblchk = "main:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-mock", "setuptools", "wheel", "build"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "test/*",
  "setup.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools]
# Explicitly list py_modules since sources are top-level, not in a package dir.
py-modules = ["api_client","config","dnscheck","domaincheck","files","logger","mail","main","rblcheck","signals","webhook"]

[tool.setuptools.package-data]
# Include service file and config directory contents.
"*" = ["dnsblchk.service"]

[tool.setuptools.exclude-package-data]
"*" = ["test/*"]

[tool.setuptools.dynamic]
# (Not used now; kept for future expansion.)
